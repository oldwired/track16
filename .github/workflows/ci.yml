name: CI

# Manual runs (Actions tab or `gh workflow run CI`) and release tags only: a unit build takes a while, and
# day-to-day builds run locally (scripts/build-unit.sh).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Build for the unit (armel)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v3
      - name: Toolchain image (cached)
        uses: docker/build-push-action@v6
        with:
          context: toolchain
          tags: sp16-toolchain:gcc11-egl
          load: true
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,mode=max,scope=toolchain
      - run: scripts/build-unit.sh
      - uses: actions/upload-artifact@v4
        with:
          name: track16
          path: out/track16
          retention-days: 7
